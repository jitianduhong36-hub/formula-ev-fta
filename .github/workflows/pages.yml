name: Test and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Prepare static files
        run: |
          mkdir dist
          cp index.html guide.html style.css app.js diagram.js groups.js group-ui.js limits.js fmea-config.js fmea-model.js fmea-engine.js fmea-export.js fmea-ui.js engine.js sample.js sheets.js tree-edit.js tree-editor-ui.js collaboration.js collaboration-ui.js collaboration-config.js drive-ui.js dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
